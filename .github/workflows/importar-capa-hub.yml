name: Importar capa escolhida (execução única)
on:
  push:
    paths:
      - '.github/workflows/importar-capa-hub.yml'
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capturar imagem original e preservar no repositório
        env:
          SOURCE_ORIGINAL: "https://media.canva.com/v2/image-resize/format:PNG/height:1086/quality:100/uri:ifs%3A%2F%2FM%2F4a25a565-2db4-47a2-a4ed-d2dd99d7f3fd/watermark:F/width:1448?csig=AAAAAAAAAAAAAAAAAAAAALF5e1byFG60ojkA_2QZF1Wd4Zwy59f2ZnESqm1MD_Iy&exp=1794350049&osig=AAAAAAAAAAAAAAAAAAAAAPClUOqIAOvsf5CLqUVTE9kzlUytl-hgSNihoIyVxWl6&signer=media-rpc&token=AAIAAU0AJDRhMjVhNTY1LTJkYjQtNDdhMi1hNGVkLWQyZGQ5OWQ3ZjNmZAAAAAABoceY5ug_8hWuF29ihQYd7feCA0DbrnkRZMALZFibdEKmAk-buw&x-canva-quality=original"
          SOURCE_THUMB: "https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F4a25a565-2db4-47a2-a4ed-d2dd99d7f3fd/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAALF5e1byFG60ojkA_2QZF1Wd4Zwy59f2ZnESqm1MD_Iy&exp=1794350049&osig=AAAAAAAAAAAAAAAAAAAAAPClUOqIAOvsf5CLqUVTE9kzlUytl-hgSNihoIyVxWl6&signer=media-rpc&token=AAIAAU0AJDRhMjVhNTY1LTJkYjQtNDdhMi1hNGVkLWQyZGQ5OWQ3ZjNmZAAAAAABoceY5ug_8hWuF29ihQYd7feCA0DbrnkRZMALZFibdEKmAk-buw&x-canva-quality=thumbnail"
        run: |
          python3 - <<'PY'
          import urllib.request,os,struct,pathlib
          p=pathlib.Path('assets/capa-congresso-moraes.png')
          for label,url in [('full',os.environ['SOURCE_ORIGINAL']),('thumb',os.environ['SOURCE_THUMB'])]:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=28) as resp: data=resp.read()
                  if data[:8]!=bytes([137,80,78,71,13,10,26,10]):
                      print(label, 'não é PNG, tamanho',len(data))
                      continue
                  width,height=struct.unpack('>II',data[16:24])
                  print(label,'imagem obtida',width,height,len(data))
                  if min(width,height)<600:
                      print('Resolução insuficiente; não inserir imagem pequena')
                      continue
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(data)
                  print('Imagem escolhida salva',str(p))
                  break
              except Exception as err: print(label,'não foi possível',type(err).__name__,str(err)[:280])
          if not p.exists():
              raise SystemExit('Não foi possível recuperar imagem em resolução adequada')
          PY
      - name: Versionar a imagem no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/capa-congresso-moraes.png
          git commit -m "HUB: adicionar capa cinematografica escolhida" || echo "A imagem já estava versionada"
          git push origin HEAD:main
