name: Auditoria temporaria navegacao HUB
on:
  push:
    paths:
      - '.github/workflows/auditar-cabecalho-hub.yml'
permissions:
  contents: write
jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar navegacao das noticias
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json,collections,urllib.parse
          s=Path('index.html').read_text(encoding='utf-8')
          ls=s.splitlines()
          out=[f'CHARACTERS {len(s)}, LINES {len(ls)}']
          out.append('===== CSS TARGETS =====')
          for n,line in enumerate(ls[:240],1):
              if any(q in line.lower() for q in ['modal','article','news','drawer','item-link','searchbox']):out.append(f'LINE {n}: {line[:4500]}')
          out.append('===== HTML AND SCRIPT (except embedded JSON) =====')
          for n,line in enumerate(ls[235:],236):
              if len(line)>100000:
                  out.append(f'LINE {n}: HUGE DATA ({len(line)} characters), JSON sample {line[:1500]}')
              else:out.append(f'LINE {n}: {line[:9000]}')
          out.append('===== INLINE LINKS OR TARGETS =====')
          for match in list(re.finditer(r'(?:source_url|conectapiaui|openArticle|showArticle|newsModal|openModal|window\.open|location\.href|href=)',s,re.I))[:65]:
              out.append('AT '+str(match.start())+': '+s[max(0,match.start()-140):match.start()+180].replace('\n',' '))
          p=Path('docs/auditoria-navegacao-temp.txt')
          p.write_text('\n'.join(out)[:100000],encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/auditoria-navegacao-temp.txt
          git commit -m 'HUB: auditar links de noticias e abertura interna' || true
          git push origin HEAD:main
