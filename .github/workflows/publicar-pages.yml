name: Atualizar GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .nojekyll
      - 'artigos/**'
      - 'assets/**'
      - destaque-impeachment-moraes.js
      - hub-cabecalho-social.js
      - hub-leitura-interna.js
      - '.github/workflows/publicar-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-hub-pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos do portal
        uses: actions/checkout@v4
      - name: Preparar site estático
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R artigos _site/artigos
          cp -R assets _site/assets
          cp destaque-impeachment-moraes.js _site/destaque-impeachment-moraes.js
          cp hub-cabecalho-social.js _site/hub-cabecalho-social.js
          cp hub-leitura-interna.js _site/hub-leitura-interna.js
          node --check _site/hub-leitura-interna.js
          node --check _site/hub-cabecalho-social.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path('_site/index.html')
          content = html.read_text(encoding='utf-8')
          tag = '<script defer src="./destaque-impeachment-moraes.js"></script>'
          if tag not in content:
              if '</body>' not in content:
                  raise SystemExit('HTML sem fechamento de body; publicacao bloqueada')
              content = content.replace('</body>', tag + '\n</body>', 1)
              html.write_text(content, encoding='utf-8')
          script = '<script defer src="./hub-cabecalho-social.js?v=018"></script>'
          if script not in content:
              content = content.replace('</body>', script + '\n</body>', 1)
              html.write_text(content, encoding='utf-8')
          for selector in ['class="head-right"', 'id="search-form"', 'id="menu-drawer"']:
              if selector not in content:
                  raise SystemExit('Seletor esperado ausente: ' + selector)
          assert 'hub-cabecalho-social.js?v=018' in html.read_text(encoding='utf-8')
          internal = '<script defer src="./hub-leitura-interna.js?v=015"></script>'
          if internal not in content:
              content = content.replace('</body>', internal + '\n</body>', 1)
              html.write_text(content, encoding='utf-8')
          assert internal in html.read_text(encoding='utf-8')
          assert Path('_site/artigos/sebastiana-86-anos-direito-enem-2026.html').is_file()

          assert 'destaque-impeachment-moraes.js' in html.read_text(encoding='utf-8')
          PY
          test -s _site/artigos/impeachment-moraes-senado-2027.html
          test -s _site/assets/congresso-articulacao-ilustrativa.svg
          touch _site/.nojekyll
          test -s _site/index.html
      - name: Enviar arquivos para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar portal no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
