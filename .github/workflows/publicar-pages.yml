name: Atualizar GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .nojekyll
      - 'artigos/**'
      - 'assets/**'
      - destaque-impeachment-moraes.js
      - '.github/workflows/publicar-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-hub-pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos do portal
        uses: actions/checkout@v4
      - name: Preparar site estático
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R artigos _site/artigos
          cp -R assets _site/assets
          cp destaque-impeachment-moraes.js _site/destaque-impeachment-moraes.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path('_site/index.html')
          content = html.read_text(encoding='utf-8')
          tag = '<script defer src="./destaque-impeachment-moraes.js"></script>'
          if tag not in content:
              if '</body>' not in content:
                  raise SystemExit('HTML sem fechamento de body; publicacao bloqueada')
              content = content.replace('</body>', tag + '\n</body>', 1)
              html.write_text(content, encoding='utf-8')
          assert 'destaque-impeachment-moraes.js' in html.read_text(encoding='utf-8')
          PY
          test -s _site/artigos/impeachment-moraes-senado-2027.html
          test -s _site/assets/congresso-articulacao-ilustrativa.svg
          touch _site/.nojekyll
          test -s _site/index.html
      - name: Enviar arquivos para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar portal no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
